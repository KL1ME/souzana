# Free test backend. Website knowledge is reseeded on startup; local data is temporary.
# Keep Drive disabled until this service has durable storage.
services:
  - type: web
    name: themis-api-test
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    startCommand: npm run themis:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: THEMIS_HOST
        value: 0.0.0.0
      - key: THEMIS_ALLOWED_ORIGINS
        value: https://kl1me.github.io
      # Limits are per process. Socket peers may be shared behind Render's proxy.
      # No forwarded client-IP header is trusted without a verified proxy boundary.
      - key: THEMIS_REQUESTS_PER_MINUTE
        value: "12"
      - key: THEMIS_REQUEST_BURST
        value: "4"
      - key: THEMIS_GLOBAL_REQUESTS_PER_MINUTE
        value: "60"
      - key: THEMIS_PROVIDER_CALLS_PER_HOUR
        value: "300"
      - key: THEMIS_PROVIDER_CALLS_PER_DAY
        value: "1000"
      - key: THEMIS_MAX_CONCURRENT_REQUESTS
        value: "4"
      - key: THEMIS_TIMEOUT_MS
        value: "60000"
      - key: THEMIS_BODY_TIMEOUT_MS
        value: "10000"
      - key: THEMIS_DATABASE_PATH
        value: /tmp/themis/themis.sqlite
      - key: THEMIS_WEB_SEARCH_ENABLED
        value: "true"
      - key: THEMIS_WEB_ALLOWED_DOMAINS
        value: gov.gr,et.gr,europa.eu,dsa.gr
      - key: THEMIS_ALLOW_GENERAL_FALLBACK
        value: "false"
      - key: THEMIS_DRIVE_ENABLED
        value: "false"
